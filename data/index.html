<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
 <title>Water Tank System</title>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: 'Space Grotesk', sans-serif;
      text-align: center;
      margin-top: 30px;
    }

    .title {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .tank {
      width: 140px;
      height: 320px;
      border: 4px solid #38bdf8;
      margin: auto;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background: #1e293b;
    }

    .fill {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(to top, #0ea5e9, #38bdf8);
      transition: height 0.5s ease;
    }

    .label {
      margin-top: 20px;
      font-size: 28px;
      font-weight: bold;
    }

    .status {
      margin-top: 10px;
      font-size: 18px;
    }

    .low { color: red; }
    .mid { color: yellow; }
    .high { color: green; }

  </style>
</head>

<body>

  <div class="title">WATER LEVEL MONITOR</div>

  <div class="tank">
    <div class="fill" id="fill"></div>
  </div>

  <div class="label" id="percent">0%</div>
  <div class="status" id="status">EMPTY</div>

<script>

let socket = new WebSocket("ws://" + location.host + "/ws");

socket.onmessage = function(event){

  let data = JSON.parse(event.data);

  let level = data.level;

  document.getElementById("fill").style.height = level + "%";
  document.getElementById("percent").innerText = level + "%";

  let status = "EMPTY";
  let cls = "";

  if(level == 25) { status = "LOW"; cls = "low"; }
  if(level == 50) { status = "MEDIUM"; cls = "mid"; }
  if(level == 75) { status = "HIGH"; cls = "high"; }
  if(level == 100) { status = "FULL"; cls = "high"; }

  let statusEl = document.getElementById("status");
  statusEl.innerText = status;
  statusEl.className = cls;
};

</script>

</body>
</html>
